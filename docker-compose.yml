services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: core/Dockerfile
    image: qq-farm-bot:latest
    container_name: qq-farm-bot
    restart: unless-stopped

    ports:
      - "3007:3007"               # 管理面板
      - "18000:18000"             # 抓包登录 MITM 代理端口（默认关闭，启用后供手机 Wi-Fi 代理连入）

    volumes:
      - ../data:/app/core/data
      - ../data/napcat/auth:/app/napcat-auth:ro

    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      ADMIN_PORT: "3007"
      FARM_DATA_DIR: /app/core/data
      CAPTURE_ADVERTISE_IPS: "${CAPTURE_ADVERTISE_IPS:-auto}"
      NAPCAT_LOGIN_ENABLED: "${NAPCAT_LOGIN_ENABLED:-false}"
      # 面板登录：AUTH_ENABLED=true 且同时配置用户名与密码时生效；否则保持免登录。
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      AUTH_USERNAME: "${AUTH_USERNAME:-}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:-}"
      NAPCAT_WEBUI_URL: http://napcat:6099/api
      NAPCAT_OPENAUTH_URL: http://napcat:6099/plugin/qq-miniapp-openauth/api
      # 抓包服务默认关闭；在面板“系统配置 → Code/GID 抓取服务”开启后才会运行。
      # 代理端口固定使用 18000：
      # CAPTURE_PORTS: "18000"
      # 需要固定对外地址时，在 .env 中设置（局域网 / Tailscale 可同时填写）：
      # CAPTURE_ADVERTISE_IPS=192.168.1.100,100.64.0.2

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3007/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  napcat:
    profiles: ["napcat"]
    build:
      context: .
      dockerfile: napcat/Dockerfile
      args:
        NAPCAT_IMAGE: "${NAPCAT_IMAGE:-mlikiowa/napcat-docker:v4.18.19}"
    image: qq-farm-napcat:latest
    container_name: qq-farm-napcat
    hostname: "${NAPCAT_DEVICE_NAME:-QQ-Farm-NapCat}"
    restart: unless-stopped
    environment:
      NAPCAT_UID: "${NAPCAT_UID:-1000}"
      NAPCAT_GID: "${NAPCAT_GID:-1000}"
      # 可选：让 QQ 走代理（海外/链路不稳时更稳定）。留空则不启用。
      NAPCAT_PROXY_ADDRESS: "${NAPCAT_PROXY_ADDRESS:-}"
      NAPCAT_PROXY_PORT: "${NAPCAT_PROXY_PORT:-}"
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - ../data/napcat/config:/app/napcat/config
      - ../data/napcat/QQ:/app/.config/QQ
      - ../data/napcat/auth:/app/napcat-auth
    # NapCat 卡死时表现为「进程活着但 6099 不回包」，健康检查据此标记 unhealthy。
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 5 -o /dev/null http://127.0.0.1:6099/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - autoheal=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # NapCat 卡死时自动重启它，避免必须手动重启整个 docker。
  # 仅随 napcat profile 启动；需要挂载 docker.sock 才能重启兄弟容器。
  autoheal:
    profiles: ["napcat"]
    image: "${AUTOHEAL_IMAGE:-willfarrell/autoheal:latest}"
    container_name: qq-farm-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "180"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
